name: Deploy MSA to EC2 via Docker Hub

on:
  push:
    branches: [ main, develop ]

env:
  DOCKER_REGISTRY: kdafire   # 예: seojun123
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Docker 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ gateway-service 이미지 빌드 및 푸시
      - name: Build & Push gate-way-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gate-way-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/gate-way-service:${{ env.IMAGE_TAG }}

      # 4️⃣ core-service 이미지 빌드 및 푸시
      - name: Build & Push core-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/core-service:${{ env.IMAGE_TAG }}

      # 5️⃣ game-service 이미지 빌드 및 푸시
      - name: Build & Push game-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: game-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/game-service:${{ env.IMAGE_TAG }}

      # 6️⃣ EC2 서버에 SSH 접속해서 최신 이미지 pull 및 compose 재시작
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            cd ~/tacticai-spring-msa-mono
            docker-compose pull
            docker-compose down
            docker-compose up -d
